<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body { width: 280px; font-family: -apple-system, system-ui, "Segoe UI", Inter, sans-serif; margin: 0; padding: 14px; background: #f5f5f7; color: #1d1d1f; }
  html[data-theme="dark"] body, html[data-theme="dark"] { background: #111114; color: #f5f5f7; }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) body { background: #111114; color: #f5f5f7; }
  }
  h2 { margin: 0 0 4px 0; font-size: 17px; letter-spacing: -.02em; }
  h2 span { color: #0071e3; }
  p { font-size: 12px; opacity: .7; margin: 0 0 12px 0; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; border: 0; border-radius: 10px; padding: 10px; font-weight: 700; cursor: pointer; font-size: 13px; }
  button:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
  .primary { background: #0071e3; color: white; }
  .ghost { background: rgba(120,120,128,.18); color: inherit; }
  label.switch-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 10px 0; border-bottom: 1px solid rgba(120,120,128,.3); cursor: pointer; }
  /* Switch façon iOS */
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: rgba(120,120,128,.35); transition: background 180ms ease; pointer-events: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: transform 180ms cubic-bezier(.32,.72,.35,1); }
  .switch input:checked + .track { background: #0071e3; }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .switch input:focus-visible + .track { outline: 2px solid #0071e3; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .switch .track, .switch .track::after { transition: none; }
  }
</style>
</head>
<body>
  <h2>myapple<span>list</span></h2>
  <p>Le style Apple par-dessus vos pages MyAnimeList. Vos réglages s'appliquent aussitôt.</p>
  <label class="switch-row">Visuel Apple
    <span class="switch"><input type="checkbox" id="enabled" checked /><span class="track" aria-hidden="true"></span></span>
  </label>
  <label class="switch-row">Mode sombre
    <span class="switch"><input type="checkbox" id="dark" /><span class="track" aria-hidden="true"></span></span>
  </label>
  <label class="switch-row">Panneau notes
    <span class="switch"><input type="checkbox" id="panelOpen" /><span class="track" aria-hidden="true"></span></span>
  </label>
  <div class="row">
    <button class="ghost" id="open-mal">Ouvrir MAL</button>
  </div>
<script src="popup.js"></script>
</body>
</html>
