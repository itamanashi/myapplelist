<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  body { width: 280px; font-family: -apple-system, Inter, Segoe UI, sans-serif; margin:0; padding:14px; background:#111114; color:#f5f5f7; }
  h2 { margin:0 0 4px 0; font-size:17px; letter-spacing:-.02em; } h2 span{color:#ff3b30}
  p { font-size:12px; opacity:.7; margin:0 0 12px 0; }
  .row { display:flex; gap:8px; margin-top:10px; }
  button { flex:1; border:0; border-radius:10px; padding:10px; font-weight:700; cursor:pointer; }
  .primary { background:#0a84ff; color:white; }
  .ghost { background:rgba(255,255,255,.1); color:white; }
  label { display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08); }
</style>
</head>
<body>
  <h2>myapple<span>list</span></h2>
  <p>Notre visuel par-dessus MyAnimeList. Pas de copie, on overlay.</p>
  <label>Actif <input type="checkbox" id="enabled" checked /></label>
  <label>Dark mode <input type="checkbox" id="dark" checked /></label>
  <label>Panneau notes <input type="checkbox" id="panelOpen" /></label>
  <div class="row">
    <button class="primary" id="save">Appliquer</button>
    <button class="ghost" id="open-mal">Ouvrir MAL</button>
  </div>
<script src="popup.js"></script>
</body>
</html>
